name: IgniteUI.Blazor.Templates Release

on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: release-${{ github.ref_name }}

env:
  BUILD_CONFIGURATION: Release
  DOTNET_VERSION: "10.0.x"
  VERSION: ${{ github.ref_name }}
  PACKAGE_ID: IgniteUI.Blazor.Templates
  PROJECT_PATH: IgniteUI.Blazor.Templates/IgniteUI.Blazor.Templates.csproj
  # Public, deliberately pinned identity.
  EXPECTED_CERT_SHA256_PATH: "eng/IG.authenticode-certificates.sha256"

jobs:
  # No secrets, no OIDC token and no publishing rights: it packs the templates and refuses to hand
  # on a package whose generated projects do not build.
  build:
    name: Build and smoke-test package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Pack NuGet package
        run: >
          dotnet pack ${{ env.PROJECT_PATH }}
          --configuration ${{ env.BUILD_CONFIGURATION }}
          "-p:Version=$VERSION"
          -p:ContinuousIntegrationBuild=true
          -p:RepositoryCommit=${{ github.sha }}
          -o "${{ github.workspace }}/artifacts"

      # Only the package itself is signed (--recurse-containers false below). That is complete only
      # while it carries no assemblies or executables, which would otherwise ship unsigned.
      - name: Verify the package ships no executable code
        run: |
          if unzip -Z1 "artifacts/${PACKAGE_ID}.${VERSION}.nupkg" | grep -iE '\.(dll|exe)$'; then
            echo "::error::The template package must not contain assemblies or executables; only the package is signed."
            exit 1
          fi

      # The same gates as CI, on the release bytes. Projects are generated inside the repository so
      # they pick up its global.json, nuget.config and the isolating Directory.*.props.
      - name: Smoke-test item templates
        run: |
          TEMPLATE_SOURCE="$GITHUB_WORKSPACE/artifacts/${PACKAGE_ID}.${VERSION}.nupkg" bash IgniteUI.Blazor.Templates/test-templates.sh
          dotnet build IgniteUI.Blazor.Templates/tmp/IgbTemplateTest/IgbTemplateTest/IgbTemplateTest.csproj --configuration Release

      - name: Smoke-test project template variants
        run: |
          while read -r name args; do
            dotnet new igb-blazor -n "$name" -o "tmp/smoke/$name" --SkipRestore $args
            dotnet build "tmp/smoke/$name/$name/$name.csproj" --configuration Release
          done <<'EOF'
          SmokeWasm --Hosting Wasm
          SmokeAuto --Hosting Auto
          SmokeNoWeather --Hosting Server --IncludeWeatherSample false
          EOF

      - name: Upload unsigned package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nupkg-unsigned
          path: artifacts/${{ env.PACKAGE_ID }}.${{ env.VERSION }}.nupkg
          retention-days: 1
          if-no-files-found: error

  # Holds Key Vault access but compiles nothing: its checkout is limited to the tool manifest and
  # its pinned feed, the release scripts and the pinned certificate.
  sign:
    name: Sign and attest package
    needs: build
    runs-on: windows-latest
    timeout-minutes: 20
    environment: nuget-org-publish
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      nupkg-sha256: ${{ steps.digest.outputs.nupkg-sha256 }}

    steps:
      - name: Checkout release scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .config/dotnet-tools.json
            nuget.config
            .github/scripts
            eng/IG.authenticode-certificates.sha256
          sparse-checkout-cone-mode: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Download unsigned package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nupkg-unsigned
          path: artifacts
          digest-mismatch: error

      - name: Restore .NET local tools
        run: dotnet tool restore

      - name: Authenticate to Azure
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign NuGet package
        shell: pwsh
        run: >
          dotnet tool run sign code azure-key-vault "*.nupkg"
          --base-directory "${{ github.workspace }}/artifacts"
          --azure-key-vault-url "${{ secrets.AZURE_KEYVAULT_URL }}"
          --azure-key-vault-certificate "${{ secrets.AZURE_KEYVAULT_CERTIFICATE }}"
          --azure-credential-type azure-cli
          --recurse-containers false
          --verbosity Warning

      - name: Validate NuGet package signature
        shell: pwsh
        run: >
          .github/scripts/Assert-NuGetSignature.ps1
          -PackagePath "${env:GITHUB_WORKSPACE}/artifacts/${env:PACKAGE_ID}.${env:VERSION}.nupkg"
          -ExpectedCertificateSha256Path "${{ env.EXPECTED_CERT_SHA256_PATH }}"

      # This digest is the identity every downstream job re-checks before acting on the package.
      - name: Record package digest
        id: digest
        shell: pwsh
        run: >
          .github/scripts/Get-PackageDigest.ps1
          -PackagePath "${env:GITHUB_WORKSPACE}/artifacts/${env:PACKAGE_ID}.${env:VERSION}.nupkg"
          -WriteChecksumFile
          -GitHubOutputName 'nupkg-sha256'
          -SummaryTitle 'Signed package digest'

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.PACKAGE_ID }}.${{ env.VERSION }}.nupkg
          subject-digest: sha256:${{ steps.digest.outputs.nupkg-sha256 }}

      - name: Upload signed package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nupkg-signed
          path: artifacts/*
          retention-days: 30
          if-no-files-found: error

  # The only job that can publish. It restores nothing and compiles nothing; its checkout is a
  # scripts-only sparse one so the publish gate itself is version-controlled and reviewable.
  publish:
    name: Publish to NuGet.org
    needs: sign
    runs-on: windows-latest
    timeout-minutes: 15
    environment: nuget-org-publish
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout release scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/scripts
            eng/IG.authenticode-certificates.sha256
          sparse-checkout-cone-mode: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Download signed package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nupkg-signed
          path: artifacts
          digest-mismatch: error

      - name: Verify the package that was signed and attested
        shell: pwsh
        run: >
          .github/scripts/Get-PackageDigest.ps1
          -PackagePath "${env:GITHUB_WORKSPACE}/artifacts/${env:PACKAGE_ID}.${env:VERSION}.nupkg"
          -ExpectedSha256 "${{ needs.sign.outputs.nupkg-sha256 }}"
          -FailureMessage 'Refusing to publish.'

      - name: Validate NuGet package signature
        shell: pwsh
        run: >
          .github/scripts/Assert-NuGetSignature.ps1
          -PackagePath "${env:GITHUB_WORKSPACE}/artifacts/${env:PACKAGE_ID}.${env:VERSION}.nupkg"
          -ExpectedCertificateSha256Path "${{ env.EXPECTED_CERT_SHA256_PATH }}"

      - name: NuGet login (OIDC Trusted Publishing)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: nuget-login
        with:
          user: ${{ secrets.INFRAGISTICS_NUGET_ORG_USER }}

      # Refuses to publish over an existing version instead of using --skip-duplicate: a full rerun
      # produces newly signed bytes, so skipping the duplicate would attach this run's package and
      # checksum to a release whose published package is a different build.
      - name: Publish to NuGet.org
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: >
          .github/scripts/Publish-NuGetPackage.ps1
          -PackagePath "${env:GITHUB_WORKSPACE}/artifacts/${env:PACKAGE_ID}.${env:VERSION}.nupkg"
          -PackageId "${{ env.PACKAGE_ID }}"
          -Version "$env:VERSION"

  attach-to-release:
    name: Attach package to release
    needs: [sign, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download signed package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nupkg-signed
          path: artifacts
          digest-mismatch: error

      - name: Verify signed package digest
        env:
          EXPECTED_NUPKG_SHA256: ${{ needs.sign.outputs.nupkg-sha256 }}
        run: |
          actual=$(sha256sum "artifacts/${PACKAGE_ID}.${VERSION}.nupkg" | cut -d ' ' -f 1)
          if [[ "$actual" != "$EXPECTED_NUPKG_SHA256" ]]; then
            echo "Package digest changed before release attachment." >&2
            exit 1
          fi
          (cd artifacts && sha256sum --check "${PACKAGE_ID}.${VERSION}.nupkg.sha256")

      - name: Attach package to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: >
          gh release upload "$TAG" --clobber -R "${{ github.repository }}"
          "artifacts/${PACKAGE_ID}.${TAG}.nupkg"
          "artifacts/${PACKAGE_ID}.${TAG}.nupkg.sha256"
